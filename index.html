<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="description" content="КальКулятор — RPG внутри калькулятора от VegasDev">
<title>КальКулятор</title>
<style>
/* Как приложение «Калькулятор» на телефоне: чёрный фон, вкладки сверху, большое число справа, кнопки-скруглённые квадраты 4 в ряд, операции оранжевым. */
:root {
  --bg: #000000; --key: #2B2B2B; --key-hi: #3A3A3A; --or: #FF8A1F; --eq: #FF8A1F; --eq-hi: #FF9D45;
  --text: #EDEDED; --muted: #7D7D7D; --label: #6E6E6E;
  --pix: 'Pixelify Sans', 'Courier New', monospace; --ui: 'Inter', 'Roboto', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
* { -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; height: 100dvh; overscroll-behavior: none; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--ui); overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.app { height: 100%; height: 100dvh; width: min(460px, 100%); margin: 0 auto; display: flex; flex-direction: column; box-sizing: border-box; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: max(14px, env(safe-area-inset-bottom, 0px)); gap: 8px; }
.tabs { display: flex; align-items: center; gap: 22px; padding: 8px 4px 0 18px; flex-shrink: 0; }
.tab { border: 0; background: none; padding: 6px 0; white-space: nowrap; font-family: var(--ui); font-size: 21px; font-weight: 500; color: var(--muted); cursor: pointer; }
.tab.on { color: var(--text); }
.tab b { color: var(--or); font-weight: 500; }
.dots { margin-left: auto; width: 44px; height: 44px; border: 0; background: none; color: var(--text); font-size: 22px; line-height: 1; cursor: pointer; }
.display { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; }
canvas#lcd { display: block; width: 100%; flex: 1; min-height: 0; max-height: 50vw; object-fit: contain; object-position: center bottom; image-rendering: pixelated; background: var(--bg); }
.expr { min-height: 20px; text-align: right; font-size: 18px; color: var(--muted); letter-spacing: .1em; white-space: nowrap; overflow: hidden; padding-right: 8px; }
.num { text-align: right; font-size: clamp(34px, 6.2dvh, 60px); font-weight: 300; line-height: 1.05; padding-right: 8px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.keys { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: clamp(42px, 8.2dvh, 84px); gap: clamp(8px, 2.6vw, 14px); flex-shrink: 0; }
.keys .mini { grid-auto-rows: auto; }
.k { position: relative; border: 0; border-radius: clamp(16px, 4.5vw, 22px); background: var(--key); color: var(--text); font-family: var(--ui); font-weight: 400; font-size: clamp(22px, 4.2dvh, 34px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; padding: 0; transition: background .08s, transform .06s; }
.k small { font-size: clamp(8px, 1.2dvh, 10px); font-weight: 500; color: var(--label); line-height: 1; letter-spacing: .02em; }
.k.op { color: var(--or); }
.k.op small { color: #8A5A2E; }
.k.eq { background: var(--eq); color: #fff; }
.k.eq small { color: #FFE0C4; }
.k.top { height: clamp(30px, 4.8dvh, 46px); align-self: end; font-size: clamp(17px, 2.8dvh, 22px); }
.keys .row0 { display: contents; }
.k svg { width: 1.05em; height: 1.05em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.k.down, .k:active { background: var(--key-hi); transform: scale(.95); }
.k.eq.down, .k.eq:active { background: var(--eq-hi); }
.k.cool { opacity: .4; }
.k.blink { animation: blink .5s ease-in-out infinite alternate; }
@keyframes blink { to { box-shadow: 0 0 0 2px var(--or), 0 0 18px rgba(255,138,31,.7); } }
.k:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
body.nolabels .k small { display: none; }
.help { position: fixed; inset: 0; z-index: 8; background: #000; overflow-y: auto; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.help .in { width: min(460px, 100%); margin: 0 auto; }
.help h2 { font-size: 22px; font-weight: 500; margin: 14px 0 6px; }
.help p { color: var(--muted); line-height: 1.5; margin: 6px 0 14px; }
.help dl { display: grid; grid-template-columns: 52px 1fr; gap: 8px 12px; margin: 0; }
.help dt { font-size: 22px; color: var(--or); text-align: center; background: var(--key); border-radius: 12px; padding: 6px 0; }
.help dt.d { color: var(--text); }
.help dd { margin: 0; align-self: center; line-height: 1.4; color: #CFCFCF; }
.help .close { margin: 22px 0 8px; width: 100%; height: 52px; border: 0; border-radius: 18px; background: var(--eq); color: #fff; font-family: var(--ui); font-size: 18px; cursor: pointer; }
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
@media (max-width: 360px) { .tab { font-size: 18px; } .tabs { gap: 14px; padding-left: 8px; } }
@media (max-height: 640px) { .k small { display: none; } .tabs { padding-top: 0; } .tab { font-size: 18px; } }
@media (min-aspect-ratio: 4/3) and (max-height: 520px) { .app { width: min(920px, 100%); display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; column-gap: 18px; } .tabs { grid-column: 1 / -1; } .keys { grid-auto-rows: clamp(30px, 11dvh, 56px); } .k.top { height: clamp(26px, 8dvh, 40px); } }
@media (prefers-reduced-motion: reduce) { .k { transition: none; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Inter:wght@400;500;600&display=swap">

<div class="app">
  <div class="tabs">
    <button class="tab on">Каль<b>К</b>улятор</button>
    <button class="tab" id="helpTab">Как играть</button>
    <button class="dots" id="dots" aria-label="Подписи на кнопках">⋮</button>
  </div>
  <div class="display">
    <canvas id="lcd" width="320" height="140" aria-label="Поле боя"></canvas>
    <div class="expr" id="expr"><span></span></div>
    <div class="num" id="num">0</div>
  </div>
  <div class="keys" id="keys"></div>
</div>
<div class="help" id="help" hidden><div class="in">
  <h2>Каль<b style="color:var(--or);font-weight:500">К</b>улятор</h2>
  <p>Единичка защищает калькулятор от цифр. Каждая кнопка — действие. Удары подряд растят множитель, а число на экране — твои очки.</p>
  <dl id="helpList"></dl>
  <p>Секретные комбо, например: <b>) / / /</b> залп, <b>8 ) /</b> снайпер, <b>1 9</b> прыжок с топором. Остальные ищи сам.</p>
  <button class="close" id="helpClose">Играть</button>
</div></div>
<canvas id="fx"></canvas>

<script>
'use strict';
// ---------- кнопки: раскладка как у настоящего калькулятора ----------
const SVG_BACK = '<svg viewBox="0 0 24 24"><path d="M9 5h11v14H9l-6-7z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></svg>';
const SVG_SWAP = '<svg viewBox="0 0 24 24"><rect x="3" y="9" width="10" height="10" rx="2"/><rect x="11" y="5" width="10" height="10" rx="2"/></svg>';
// [код действия, что на кнопке, подпись, классы]
const KEYS = [
  ['(', '(', 'ритуал', 'op top'], [')', ')', 'лук', 'op top'], ['±', '±', 'отражение', 'op top'], ['?', '?', 'как играть', 'op top'],
  ['CE', 'AC', 'отмена', 'op'], ['←', SVG_BACK, 'отскок', 'op'], ['%', '%', 'проклятие', 'op'], ['/', '÷', 'стрела', 'op'],
  ['7', '7', 'коса'], ['8', '8', 'бинокль'], ['9', '9', 'топор'], ['×', '×', 'сокровище', 'op'],
  ['4', '4', 'посох'], ['5', '5', 'змея'], ['6', '6', 'вихрь'], ['−', '−', 'вычесть', 'op'],
  ['1', '1', 'прыжок'], ['2', '2', 'утка'], ['3', '3', 'огонь'], ['+', '+', 'лечение', 'op'],
  ['C', SVG_SWAP, 'пауза', 'op'], ['0', '0', 'шарик'], ['.', ',', 'заряд'], ['=', '=', 'финишер', 'eq'],
];
const keyEls = {};
const kc = document.getElementById('keys');
for (const [k, face, label, cls] of KEYS) {
  const b = document.createElement('button');
  b.className = 'k' + (cls ? ' ' + cls : ''); b.innerHTML = face + '<small>' + label + '</small>';
  b.setAttribute('aria-label', label);
  b.addEventListener('pointerdown', (e) => { e.preventDefault(); if (k === '?') openHelp(); else press(k); });
  kc.appendChild(b); keyEls[k] = b;
}
// справка из той же таблицы кнопок
document.getElementById('helpList').innerHTML = KEYS.filter((x) => x[0] !== '?').map(([k, face, label, cls]) => '<dt class="' + (cls && cls.includes('op') ? '' : 'd') + '">' + face + '</dt><dd>' + ({
  '(': 'ритуал: набери до 6 кнопок и жми = — сработают разом с двойной силой', ')': 'натянуть лук, потом ÷ стреляет', '±': 'отражение: отбивает «?» босса и врагов',
  'CE': 'отменить посох, заряд и ритуал', '←': 'отскок назад, на миг неуязвим', '%': 'проклятие: врагам −50%, боссу −10%', '/': 'стрела (с натянутым луком — сильная)',
  '7': 'коса: удар по кругу', '8': 'бинокль: видно невидимок и спрятанные сундуки, урон ×1.5', '9': 'топор; в прыжке — удар с неба', '×': 'забрать сокровище',
  '4': 'посох: следующая кнопка становится магией', '5': 'змея-союзник с ядом', '6': 'вихрь стягивает врагов', '−': 'вычесть: враг теряет своё же число',
  '1': 'прыжок', '2': 'утка носит сокровища и клюёт', '3': 'огонь; с двумя зарядами — метеоры', '+': 'лечение',
  'C': 'пауза', '0': 'шарик-щит на один удар', '.': 'заряд магии для 3, 6, 7', '=': 'финишер: тратит цепь ударов на мощный удар по всем',
}[k] || label) + '</dd>').join('');
function openHelp() { document.getElementById('help').hidden = false; if (S && S.state === 'play') S.paused = true; }
document.getElementById('helpTab').onclick = openHelp;
document.getElementById('helpClose').onclick = () => { document.getElementById('help').hidden = true; if (S) S.paused = false; };
document.getElementById('dots').onclick = () => document.body.classList.toggle('nolabels');
const KEYMAP = { '*': '×', 'x': '×', '-': '−', 'Backspace': '←', 'Delete': 'CE', 'Escape': 'C', 'Enter': '=', '=': '=', '\\': '±', 'n': '±' };
addEventListener('keydown', (e) => {
  if (e.repeat) return;
  let k = KEYMAP[e.key] || e.key;
  if (k === ',') k = '.';
  if (keyEls[k]) { e.preventDefault(); press(k); keyEls[k].classList.add('down'); setTimeout(() => keyEls[k].classList.remove('down'), 90); }
});

// ---------- звук: писк калькулятора и удары, синтезом ----------
let AC = null;
function beep(f, d, type, vol, slide) {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
    o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
    g.gain.setValueAtTime(vol || .05, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d);
  } catch (e) { /* без звука */ }
}

// ---------- ЖК-экран ----------
const lcd = document.getElementById('lcd'), g = lcd.getContext('2d');
const W = 320, H = 140, GROUND = 122, HX = 46;
const INK = '#EDEDED', GHOST = 'rgba(237,237,237,.06)', BGC = '#000000';
// семисегментные цифры: a b c d e f g
const SEG = { '0': 'abcdef', '1': 'bc', '2': 'abged', '3': 'abgcd', '4': 'fgbc', '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abcdfg', '-': 'g', 'E': 'afged', 'r': 'eg', 'o': 'cdeg' };
function seg7(ch, x, y, w, h, t, col, ghost) {
  const on = SEG[ch] || '', hh = (h - t) / 2;
  const R = { a: [x + t, y, w - 2 * t, t], b: [x + w - t, y + t, t, hh - t], c: [x + w - t, y + hh + t, t, hh - t], d: [x + t, y + h - t, w - 2 * t, t], e: [x, y + hh + t, t, hh - t], f: [x, y + t, t, hh - t], g: [x + t, y + hh, w - 2 * t, t] };
  for (const s in R) {
    if (on.includes(s)) { g.fillStyle = col; g.fillRect(...R[s].map(Math.round)); }
    else if (ghost) { g.fillStyle = GHOST; g.fillRect(...R[s].map(Math.round)); }
  }
}
function segNum(str, x, y, w, h, t, gap, col) { for (let i = 0; i < str.length; i++) seg7(str[i], x + i * (w + gap), y, w, h, t, col, true); }
function px(text, x, y, size, col, align) { g.font = '600 ' + size + 'px ' + 'Pixelify Sans, monospace'; g.fillStyle = col || INK; g.textAlign = align || 'left'; g.textBaseline = 'alphabetic'; g.fillText(text, x, y); }

// ---------- эффекты за пределами экрана ----------
const fx = document.getElementById('fx'), fg = fx.getContext('2d');
let fxParts = [], cracks = [];
function fxResize() { const d = devicePixelRatio || 1; fx.width = innerWidth * d; fx.height = innerHeight * d; fg.setTransform(d, 0, 0, d, 0, 0); }
addEventListener('resize', fxResize); fxResize();
function toPage(x, y) { const r = lcd.getBoundingClientRect(), k = Math.min(r.width / W, r.height / H), ox = r.left + (r.width - W * k) / 2, oy = r.bottom - H * k; return [ox + x * k, oy + y * k]; }
function burst(x, y, color, n, power, size) {
  const [X, Y] = toPage(x, y);
  for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = (Math.random() * .7 + .3) * power; fxParts.push({ x: X, y: Y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - power * .3, life: 1, col: color, sz: (size || 3) * (Math.random() * .6 + .7) }); }
}
function crack(x, y) {
  const [X, Y] = toPage(x, y), lines = [];
  for (let i = 0; i < 7; i++) { let a = Math.random() * Math.PI * 2, px0 = X, py0 = Y; const seg = [[px0, py0]]; for (let j = 0; j < 6; j++) { a += (Math.random() - .5) * .9; px0 += Math.cos(a) * (20 + Math.random() * 30); py0 += Math.sin(a) * (20 + Math.random() * 30); seg.push([px0, py0]); } lines.push(seg); }
  cracks.push({ lines, life: 2.2 });
}

// ---------- состояние игры ----------
let S;
function reset() {
  document.querySelectorAll('.k.blink').forEach((b) => b.classList.remove('blink'));
  S = {
    t: 0, score: 0, chain: 0, lastHit: -9, wave: 0, waveT: 0, spawnQ: [], state: 'intro', introT: 0,
    hero: { y: 0, vy: 0, hp: 4, inv: 0, bow: 0, shield: 0, staff: false, charge: 0, reflect: 0, swing: 0, swingK: '', x: HX, healCd: 0, curseCd: 0, duckCd: 0 },
    hints: S && S.hints ? S.hints : {}, hint: null,
    enemies: [], proj: [], allies: [], treasure: [], whirls: [], floats: [], dust: [], banner: null, ritual: null, buf: [], shake: 0, flash: 0, paused: false,
  };
  nextWave();
}
const WAVES = [
  { list: [2, 3, 7, 2, 3], gap: 1.9 },
  { list: [7, 2, 4, 3, 7, 5, 2], gap: 1.6 },
  { list: [4, 7, 'h2', 3, 'h7', 6, 'h4', 2, 7], gap: 1.4 },
  { boss: 404 },
];
function nextWave() {
  S.wave++; const w = WAVES[S.wave - 1];
  if (!w) { S.state = 'win'; return; }
  S.waveT = 0; S.spawnQ = [];
  if (w.boss) { S.spawnQ.push({ t: 2.2, boss: true }); banner('БОСС 404', 'страница не найдена'); beep(110, .6, 'sawtooth', .07, 55); }
  else { w.list.forEach((d, i) => S.spawnQ.push({ t: 1.6 + i * w.gap, d })); banner('ВОЛНА ' + S.wave, ''); }
}
function spawn(s) {
  if (s.boss) { S.enemies.push({ boss: true, digit: '404', x: 280, y: 0, hp: 420, max: 420, speed: 6, hidden: true, rev: 0, burn: 0, poison: 0, atk: 2.5, tp: 6, w: 54, h: 40 }); return; }
  const hidden = typeof s.d === 'string', d = hidden ? +s.d.slice(1) : s.d;
  const hp = 6 + d * 2, speed = d === 7 ? 30 : d === 4 ? 12 : d === 6 ? 15 : 20;
  S.enemies.push({ digit: String(d), x: W + 10, y: 0, hp, max: hp, speed, hidden, rev: 0, burn: 0, poison: 0, w: 13, h: 22, kb: 0 });
}
function banner(a, b) { S.banner = { a, b, t: 1.8 }; }
// подсказка показывается один раз за игру: текст внизу экрана и мигающая кнопка, пока её не нажмут (или 6 с)
function hint(id, text, key) {
  if (S.hints[id]) return; S.hints[id] = 1;
  if (S.hint && S.hint.key && keyEls[S.hint.key]) keyEls[S.hint.key].classList.remove('blink');
  S.hint = { text, key, t: 6 };
  if (key && keyEls[key]) keyEls[key].classList.add('blink');
  beep(1760, .05, 'square', .03);
}
function hintDone(k) { if (S.hint && S.hint.key === k) { keyEls[k].classList.remove('blink'); S.hint.t = Math.min(S.hint.t, .8); } }

// ---------- урон и очки ----------
function mult() { return 1 + Math.min(40, S.chain) * .1; }
function hit(e, dmg, kind) {
  if (!e || e.hp <= 0) return;
  let d = dmg;
  if (e.hidden && e.rev <= 0) d *= .3;                    // не видишь — бьёшь вслепую
  else if (e.rev > 0) d *= 1.5;                           // бинокль показал слабое место
  d = Math.max(1, Math.round(d));
  e.hp -= d; e.flash = .12;
  if (S.t - S.lastHit < 2.4) S.chain++; else S.chain = 1;
  S.lastHit = S.t;
  const pts = Math.round(d * 10 * mult()); S.score += pts;
  S.floats.push({ x: e.x, y: GROUND - e.h - 8 - (e.boss ? 18 : 0), txt: String(d), t: .8 });
  const col = kind === 'fire' ? '#FF7A2E' : kind === 'magic' ? '#6FE3FF' : kind === 'poison' ? '#9BFF5A' : '#F4F0E6';
  if (d >= 8) burst(e.x, GROUND - e.h / 2, col, Math.min(28, d), 4 + d / 4, 3);
  if (e.hp <= 0) kill(e);
}
function kill(e) {
  S.score += Math.round((e.boss ? 5000 : 100) * mult());
  burst(e.x, GROUND - e.h / 2, '#F4F0E6', e.boss ? 120 : 18, e.boss ? 14 : 6, e.boss ? 5 : 3);
  for (let i = 0; i < (e.boss ? 40 : 8); i++) S.dust.push({ x: e.x + (Math.random() - .5) * e.w, y: GROUND - Math.random() * e.h, vx: (Math.random() - .5) * 90, vy: -Math.random() * 120, t: 1 });
  beep(e.boss ? 80 : 300, e.boss ? .9 : .12, 'square', .06, e.boss ? 30 : 120);
  if (e.boss) { crack(e.x, GROUND - 30); crack(e.x - 40, GROUND - 50); S.shake = 1; S.flash = 1; setTimeout(() => { S.state = 'win'; }, 1600); }
  if (Math.random() < .25) S.treasure.push({ x: e.x, hidden: Math.random() < .5, ttl: 9 });
}
function nearest(range, both) {
  let best = null, bd = 1e9;
  for (const e of S.enemies) { if (e.hp <= 0) continue; const dx = e.x - S.hero.x; if (!both && dx < -6) continue; if (Math.abs(dx) < bd && Math.abs(dx) <= range) { bd = Math.abs(dx); best = e; } }
  return best;
}
function airborne() { return S.hero.y < -6; }

// ---------- комбо: последние нажатия ----------
const COMBOS = [
  { seq: ')///', name: 'ЗАЛП', bonus: 300 },
  { seq: '8)/', name: 'СНАЙПЕР', bonus: 200 },
  { seq: '..3', name: 'ОГНЕННЫЙ ШТОРМ', bonus: 300 },
  { seq: '999', name: 'ДРОВОСЕК', bonus: 250 },
  { seq: '19', name: 'ПРЫЖОК С ТОПОРОМ', bonus: 150 },
  { seq: '55', name: 'КЛУБОК ЗМЕЙ', bonus: 150 },
  { seq: '8×', name: 'КЛАДОИСКАТЕЛЬ', bonus: 200 },
